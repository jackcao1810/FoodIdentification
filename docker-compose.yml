version: '3.8'

services:
  python:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: food-id-python
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHON_SERVICE_URL=http://localhost:8000
    volumes:
      - python-models:/app/models
      - python-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - food-id-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: food-id-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PYTHON_SERVICE_URL=http://python:8000
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
    volumes:
      - server-uploads:/app/uploads
    depends_on:
      python:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - food-id-network

  nginx:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: food-id-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    volumes:
      - nginx-cache:/var/cache/nginx
    networks:
      - food-id-network

volumes:
  python-models:
    driver: local
  python-data:
    driver: local
  server-uploads:
    driver: local
  nginx-cache:
    driver: local

networks:
  food-id-network:
    driver: bridge
